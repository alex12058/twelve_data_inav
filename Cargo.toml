[package]
name = "twelve_data_inav"
version = "0.5.4"
edition = "2021"
authors = ["Lukas Krejci <code@krejci.pw>", "Alex Shand <ashand@inav.ca>"]
homepage = "https://github.com/alex12058/twelve_data_inav"
repository = "https://github.com/alex12058/twelve_data_inav"
description = "[DEPRECATED] Use twelve-data-client instead. Simple Rust API for accessing the Twelve Data HTTP API (https://twelvedata.com)"
license = "MIT"
readme = "README.md"
keywords = ["twelvedata", "currency", "finance", "stock", "exchange"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
async-trait = "0.1"
reqwest = { version = "0.13.1", optional = true }
surf = { version = "2.3", optional = true }
wreq = { version = "5.3.0", optional = true }
axum = { version = "0.8.8", optional = true }
serde_urlencoded = "0.7"
serde_json = "1.0"
serde_derive = "1.0"
serde = "1.0"
serde_with = "3.8"
derive_builder = "0.20"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.4.0"

[dev-dependencies]
tokio = { version = "1.38", features = ["full"] }
tokio-test = "0.4"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["reqwest-client"]
reqwest-client = ["reqwest"]
surf-client = ["surf"]
wreq-client = ["wreq"]
axum = ["dep:axum"]
